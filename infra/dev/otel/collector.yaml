# Dev collector. Two jobs beyond forwarding:
#
#   1. Bounded cardinality. Contracts and operations both forbid ticket IDs, prompts,
#      filenames and people from becoming metric labels (S8 exit criteria). The SDK metric
#      registry is the primary defence; this is the backstop that catches a service that
#      bypassed it, so a cardinality explosion shows up locally instead of in production.
#   2. Redaction. Attributes that carry a secret-class value are dropped before export.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Defence in depth only. The real guarantee is that a secret value is never put into a
  # span in the first place (contracts §1) — see packages/sdk redaction.
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: api_key
        action: delete
      - key: token
        action: delete
      - key: secret
        action: delete
      - key: password
        action: delete
      - key: credential
        action: delete

  # Anything unbounded that slipped into a metric label is dropped here rather than
  # exported. Losing a label is recoverable; a multi-million-series metric is not.
  attributes/bounded-cardinality:
    include:
      match_type: regexp
      metric_names: ['.*']
    actions:
      - key: ticket_id
        action: delete
      - key: workflow_id
        action: delete
      - key: prompt
        action: delete
      - key: filename
        action: delete
      - key: user
        action: delete
      - key: actor
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, attributes/bounded-cardinality, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
